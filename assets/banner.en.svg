<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="spar — the second model that pushes back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#0e0d14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#6d82ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d82ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.72" cy="0.9" r="0.25">
      <stop offset="0" stop-color="#f0c674" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f0c674" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab6ff"/>
    </linearGradient>
    <linearGradient id="railA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa8ff"/>
      <stop offset="1" stop-color="#5f74ff"/>
    </linearGradient>
    <linearGradient id="railB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="railG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc9b"/>
      <stop offset="1" stop-color="#e5b95c"/>
    </linearGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="258">
      <stop offset="0" stop-color="#9aa8ff"/>
      <stop offset="0.5" stop-color="#ff9a7d"/>
      <stop offset="1" stop-color="#f0c674"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>
  <rect width="1200" height="320" fill="url(#glowG)"/>

  
  <g fill="none" stroke-width="1.5" opacity="0.14">
    <circle cx="420" cy="160" r="150" stroke="#8f9cff"/>
    <circle cx="540" cy="160" r="150" stroke="#ff8a6a"/>
  </g>

  
  <g font-family="'Segoe UI Variable Display','Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="68" y="150" font-size="104" font-weight="700" letter-spacing="-4" fill="url(#word)">spar</text>
    <text x="72" y="194" font-size="23" fill="#a9adc0" letter-spacing="0.2">the second model that pushes back</text>
  </g>

  
  <g font-family="Consolas,'Cascadia Mono',SFMono-Regular,Menlo,monospace" font-size="13">
    <g transform="translate(72 226)">
      <rect width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#9aa8ff" stroke-opacity="0.35"/>
      <circle cx="17" cy="17" r="4" fill="#9aa8ff"/>
      <text x="30" y="21.5" fill="#e9ebf5">open</text>
      <text x="72" y="21.5" fill="#7d8296">starts a debate</text>
    </g>
    <g transform="translate(272 226)">
      <rect width="218" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ff9a7d" stroke-opacity="0.35"/>
      <circle cx="17" cy="17" r="4" fill="#ff9a7d"/>
      <text x="30" y="21.5" fill="#e9ebf5">result</text>
      <text x="84" y="21.5" fill="#7d8296">fetches the reply</text>
    </g>
    <g transform="translate(502 226)">
      <rect width="238" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#f0c674" stroke-opacity="0.4"/>
      <circle cx="17" cy="17" r="4" fill="#f0c674"/>
      <text x="30" y="21.5" fill="#e9ebf5">verdict</text>
      <text x="94" y="21.5" fill="#7d8296">delivers a verdict</text>
    </g>
  </g>

  
  <g fill="none" stroke="url(#seam)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M770 70 V258"/>
    <path d="M770 168 H836" stroke="#ff9a7d" stroke-dasharray="1 6"/>
  </g>
  <circle cx="770" cy="70" r="5" fill="#9aa8ff"/>
  <circle cx="770" cy="168" r="5" fill="#ff9a7d"/>
  <circle cx="770" cy="258" r="5" fill="#f0c674"/>

  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <!-- A -->
    <g transform="translate(800 28)" filter="url(#soft)">
      <rect width="316" height="90" rx="16" fill="#12152a" stroke="#9aa8ff" stroke-opacity="0.32"/>
      <rect x="0" y="14" width="4" height="62" rx="2" fill="url(#railA)"/>
      <circle cx="30" cy="26" r="11" fill="#9aa8ff" fill-opacity="0.18" stroke="#9aa8ff" stroke-opacity="0.6"/>
      <text x="30" y="30.5" font-size="12" font-weight="700" fill="#cfd6ff" text-anchor="middle">A</text>
      <text x="50" y="30" font-size="11" letter-spacing="1.4" fill="#8e9bef">FOR</text>
      <rect x="22" y="48" width="262" height="7" rx="3.5" fill="#cfd6ff" opacity="0.5"/>
      <rect x="22" y="62" width="214" height="7" rx="3.5" fill="#cfd6ff" opacity="0.28"/>
    </g>
    <!-- B -->
    <g transform="translate(836 126)" filter="url(#soft)">
      <rect width="316" height="90" rx="16" fill="#1d1315" stroke="#ff9a7d" stroke-opacity="0.32"/>
      <rect x="0" y="14" width="4" height="62" rx="2" fill="url(#railB)"/>
      <circle cx="30" cy="26" r="11" fill="#ff9a7d" fill-opacity="0.16" stroke="#ff9a7d" stroke-opacity="0.6"/>
      <text x="30" y="30.5" font-size="12" font-weight="700" fill="#ffd6c9" text-anchor="middle">B</text>
      <text x="50" y="30" font-size="11" letter-spacing="1.4" fill="#f2987c">AGAINST</text>
      <rect x="22" y="48" width="240" height="7" rx="3.5" fill="#ffd6c9" opacity="0.5"/>
      <rect x="22" y="62" width="272" height="7" rx="3.5" fill="#ffd6c9" opacity="0.28"/>
    </g>
    
    <g transform="translate(800 232)" filter="url(#soft)">
      <rect width="316" height="52" rx="16" fill="#1a1710" stroke="#f0c674" stroke-opacity="0.45"/>
      <rect x="0" y="10" width="4" height="32" rx="2" fill="url(#railG)"/>
      
      <g transform="translate(34 26)" fill="none" stroke="#f0c674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -11 V11 M-6 11 H6 M-11 -6 H11"/>
        <path d="M-11 -6 L-15 2 H-7 Z M11 -6 L7 2 H15 Z"/>
      </g>
      <text x="62" y="31" font-size="14" font-weight="600" fill="#f6e3b4">verdict</text>
      <rect x="150" y="22" width="132" height="7" rx="3.5" fill="#f6e3b4" opacity="0.35"/>
    </g>
  </g>
</svg>
