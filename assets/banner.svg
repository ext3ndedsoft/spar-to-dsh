  </g>

  <g transform="translate(1010 74)" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#7d7d90">
    <text x="0" y="0">A</text>
    <text x="0" y="22" fill="#ff9b7a">B</text>
    <text x="0" y="52" fill="#4d4d5e">слепой</text>
    <text x="0" y="70" fill="#4d4d5e">судья</text>
  </g>
