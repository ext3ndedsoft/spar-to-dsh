<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="spar — вторая модель, которая возражает">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080c"/>
      <stop offset="0.55" stop-color="#0c0c12"/>
      <stop offset="1" stop-color="#121019"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.78" r="0.45">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9cff"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb199" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="judge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>

  <!-- две стороны: кольца пересекаются, судья — точка на пересечении -->
  <g transform="translate(168 158)">
    <circle cx="-36" cy="0" r="54" fill="none" stroke="url(#ringA)" stroke-width="3"/>
    <circle cx="36" cy="0" r="54" fill="none" stroke="url(#ringB)" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="url(#judge)" opacity="0.55"/>
    <circle cx="0" cy="0" r="4.5" fill="#f4f4f8"/>
    <text x="-52" y="80" fill="#9aa0b2" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" text-anchor="middle">A · ЗА</text>
    <text x="52" y="80" fill="#9aa0b2" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" text-anchor="middle">B · ПРОТИВ</text>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#f2f2f7">
    <text x="300" y="146" font-size="82" font-weight="600" letter-spacing="-2.4">spar</text>
    <text x="303" y="190" font-size="24" fill="#a6a9b8" letter-spacing="0.2">вторая модель, которая возражает</text>
  </g>

  <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="1004" y="126" fill="#c9ccd8" text-anchor="end">open</text>
    <text x="1028" y="126" fill="#656a79">заводит спор</text>
    <text x="1004" y="158" fill="#c9ccd8" text-anchor="end">result</text>
    <text x="1028" y="158" fill="#656a79">забирает ответ</text>
    <text x="1004" y="190" fill="#c9ccd8" text-anchor="end">verdict</text>
    <text x="1028" y="190" fill="#656a79">выносит приговор</text>
  </g>
</svg>