<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="spar — вторая модель, которая возражает">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0e"/>
      <stop offset="0.55" stop-color="#0d0d13"/>
      <stop offset="1" stop-color="#111018"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.3" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa6ff"/>
      <stop offset="1" stop-color="#ff9b7a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>

  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 246h1200"/>
    <path d="M0 74h1200"/>
    <path d="M120 0v320"/>
    <path d="M1080 0v320"/>
  </g>

  <g transform="translate(120 160)">
    <circle cx="-34" cy="0" r="46" fill="none" stroke="url(#mark)" stroke-width="3" opacity="0.9"/>
    <circle cx="34" cy="0" r="46" fill="none" stroke="url(#mark)" stroke-width="3" opacity="0.55"/>
    <circle cx="0" cy="-58" r="3.5" fill="#9aa6ff"/>
    <circle cx="0" cy="58" r="3.5" fill="#ff9b7a"/>
  </g>

  <g fill="#f2f2f7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="230" y="150" font-size="86" font-weight="600" letter-spacing="-2">spar</text>
    <text x="233" y="196" font-size="25" fill="#a9a9b8" letter-spacing="0.4">вторая модель, которая возражает</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#6f6f82">
